networks:
  clinic_network:
    name: clinic_network
    driver: bridge

volumes:
  clinic_pgdata:
    name: clinic_pgdata

services:
  # ==============================================================
  # 1. DATABASE: PostgreSQL 16 Alpine
  # ==============================================================
  postgres:
    image: postgres:16
    container_name: clinic_postgres
    restart: unless-stopped
    networks:
      - clinic_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Strictly internal: Port 5432 is not exposed to the host to eliminate any port collisions with local host PostgreSQL

  # ==============================================================
  # 2. BACKEND API: Node 20 Express + Socket.IO + Prisma
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    networks:
      - clinic_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-clinic_jwt_super_secure_key_2026_dental_ortho}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Strictly internal: Accessible exclusively through the frontend Nginx reverse proxy

  # ==============================================================
  # 3. FRONTEND & GATEWAY: React 19 + Nginx
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic_frontend
    restart: unless-stopped
    networks:
      - clinic_network
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
